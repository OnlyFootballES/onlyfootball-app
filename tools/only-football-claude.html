<title>Only Football</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600&family=Saira+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral en PC, barra inferior en móvil. Identidad ON: fondo negro fijo como el logotipo principal, blanco y negro puro, Saira (geométrica y cuadrada como el logotipo), datos en mono */
:root{
  color-scheme:dark;
  --bg:#000000; --surface:#0b0b0b; --surface-2:#161616; --line:#2d2d2d; --fg:#f2f2f0; --muted:#9a9a96;
  --accent:#f2f2f0; --accent-fg:#000000; --accent-soft:#1c1c1c;
  --pitch:#121212; --pitch-2:#181818; --pitch-line:rgba(255,255,255,.78);
  --home-fill:#ffffff; --home-text:#0b0b0b; --away-fill:#8f8f8c; --away-text:#0b0b0b;
  --ok:#62c78f; --ok-soft:#14301f; --warn:#e7a54c; --warn-soft:#352610; --bad:#ef8075; --bad-soft:#3a1714; --info:#82aee6; --info-soft:#152438;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2rem;text-transform:uppercase}
h2{font-size:1.35rem;text-transform:uppercase}
h3{font-size:1.1rem;text-transform:uppercase;letter-spacing:.03em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:22px 14px;gap:20px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:0 8px;color:var(--fg)}
.brand .on-mark{height:30px;width:auto;display:block}
.brand-name{font-family:var(--f-body);font-weight:400;font-size:.86rem;letter-spacing:.16em;line-height:1}
.brand-sub{font-size:.68rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.mtop .brand{flex-direction:row;align-items:center;gap:10px;padding:0}
.mtop .brand .on-mark{height:22px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:var(--r);font-family:var(--f-display);font-weight:600;font-size:1.08rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--fg);color:var(--bg)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav svg,.tabbar svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;padding:0 8px;font-size:.82rem;color:var(--muted)}
.side-foot strong{color:var(--fg);font-weight:600}

.main{min-width:0;padding-block:26px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mtop{display:none;align-items:center;justify-content:space-between;gap:12px}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
.tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:var(--r);font-family:var(--f-display);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:56px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button{flex:1 1 0;min-width:0;padding:6px 2px}.tabbar button span{font-size:.56rem;letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar button:focus-visible{outline:2px solid var(--accent)}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none}.tabbar{display:flex}.mtop{display:flex}h1{font-size:1.65rem}.main{padding-block:16px 110px}}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head-l{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.9rem}
.back:hover{color:var(--fg)}
.back:focus-visible{outline:2px solid var(--accent)}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn[disabled]{opacity:.55;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}

.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.span,.check.span{grid-column:1/-1}
.fld label{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
input[disabled],select[disabled],textarea[disabled]{opacity:1;background:transparent;border-color:transparent;padding-left:0;color:var(--fg)}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.form-actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.search{position:relative;flex:1 1 220px;min-width:0}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select{width:auto;flex:0 1 auto}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-family:var(--f-mono);font-size:.78rem;opacity:.75}
.chip:focus-visible{outline:2px solid var(--accent)}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pos{font-family:var(--f-mono);font-size:.74rem;font-weight:500;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--fg)}

.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--muted)}
.pcard{cursor:default}.pcard-open{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}.pcard-open:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pcard-del{display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding-top:8px}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card-t{font-family:var(--f-display);font-weight:700;font-size:1.2rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;overflow-wrap:anywhere}
.card-m{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.card-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0;padding-top:2px}
.li-main{flex:1;min-width:0}
.li-t{font-weight:600;overflow-wrap:anywhere}
.li-s{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.li button.linky,.mk-row button.linky{all:unset;cursor:pointer;font-weight:600}
.mk-row button.linky{flex:1 1 auto;min-width:0}
.li button.linky:hover{color:var(--accent)}
.li button.linky:focus-visible{outline:2px solid var(--accent)}
.days{font-family:var(--f-mono);font-size:.82rem;font-weight:500;white-space:nowrap}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:1rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.kpi b{display:block;font-family:var(--f-mono);font-size:1.4rem;font-weight:500}
.kpi span{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;border-bottom:0}

.pitch-wrap{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.pitch-wrap{grid-template-columns:minmax(0,1fr)}}
.pitch{width:100%;max-width:420px;height:auto;display:block;border-radius:8px;cursor:crosshair;touch-action:manipulation;user-select:none}
.pitch .mk{cursor:grab;touch-action:none}
.pitch.picking{cursor:copy;outline:2px dashed var(--accent);outline-offset:2px}
.pitch-col{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (max-width:760px){.pitch-col{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}.pitch-col .pitch{max-height:46vh;width:auto;margin:0 auto}}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:5px 10px 5px 5px;font:inherit;font-size:.86rem;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;min-height:34px}
.lchip-d{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--home-fill);color:var(--home-text);font-family:"IBM Plex Mono",monospace;font-size:.75rem}
.lchip.away .lchip-d{background:var(--away-fill);color:var(--away-text)}
.lchip-p{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--muted)}
.lchip.placed{border-color:var(--accent)}.lchip.placed .lchip-n::after{content:" ✓";color:var(--accent)}
.lchip.picked{outline:2px solid var(--accent);outline-offset:1px}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-130%);background:var(--fg);color:var(--bg);font-weight:700;font-size:.85rem;padding:5px 10px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.5);opacity:.85}
.drag-ghost.over{background:var(--accent);opacity:1}
.mk-list{display:flex;flex-direction:column;gap:12px}
.mk-row{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mk-row:last-child{border-bottom:0;padding-bottom:0}
.mk-note{width:100%;min-height:52px}
.irows{display:flex;flex-direction:column;gap:10px;max-width:900px}
.irow{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px}
.irow.warn{border-left-color:var(--warn)}.irow.bad{border-left-color:var(--bad)}
.irow summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px auto 1fr auto 18px;align-items:center;gap:12px;padding:16px 18px}
.irow summary::-webkit-details-marker{display:none}
.irow summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
.irow-i svg{width:24px;height:24px;display:block}
.irow-t{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:1.05rem}
.irow-r{color:var(--muted);font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow-n{font-family:"IBM Plex Mono",monospace;font-weight:600;min-width:28px;text-align:center;padding:2px 8px;border-radius:999px;background:var(--surface-2)}
.irow.warn .irow-n{background:var(--warn-soft);color:var(--warn)}.irow.bad .irow-n{background:var(--bad-soft);color:var(--bad)}
.irow-c{color:var(--muted);transition:transform .15s;font-size:1.3rem;line-height:1}.irow[open] .irow-c{transform:rotate(90deg)}
.irow-b{padding:0 18px 16px}
@media (max-width:600px){.irow summary{grid-template-columns:24px 1fr auto 14px;padding:14px}.irow-r{grid-column:2/4;grid-row:2;white-space:normal}}
.dict-row{display:flex;gap:10px;align-items:stretch}.dict-row textarea{flex:1;min-height:56px}
.mic{all:unset;cursor:pointer;flex:none;width:56px;border-radius:12px;background:var(--fg);color:var(--bg);display:grid;place-items:center}.mic svg{width:26px;height:26px}.mic.on{background:var(--bad);animation:pulse 1s infinite}.mic[disabled]{opacity:.35;cursor:not-allowed}
@keyframes pulse{50%{opacity:.6}}
@media (max-width:600px){.dict-row{flex-wrap:wrap}.dict-row textarea{flex:1 1 calc(100% - 66px)}.dict-row .btn{flex:1 1 100%}}
.tcheck{all:unset;cursor:pointer;flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-weight:700;color:var(--bg)}.tcheck:focus-visible{outline:2px solid var(--accent)}
.tarea.hecha .tcheck{background:var(--ok);border-color:var(--ok)}.tarea.hecha .li-t{text-decoration:line-through;color:var(--muted)}
.mline{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.mline .fld{flex:1 1 150px;min-width:0}.mline>.btn{flex:none}
.mhead{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.mhead-l{min-width:0}.mhead-c{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.contacto{font-size:.88rem}.contacto+.contacto::before{content:"·";margin:0 6px;color:var(--muted)}
.entrada .ent-k{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}.entrada .ent-v{white-space:pre-wrap;font-size:.92rem}.mline .fld.grow{flex:2 1 260px}
.muted-list .li{opacity:.75}
.acred{gap:10px}
.acred-txt{white-space:pre-wrap;font-family:inherit;font-size:.86rem;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px;margin:0;max-height:340px;overflow:auto}
.acred-est.ok{color:var(--ok)}.acred-est.warn{color:var(--warn)}.acred-est.bad{color:var(--bad)}
.pitch .mk:focus{outline:none}
.pitch .mk:focus circle{stroke:var(--accent);stroke-width:.8}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:5px}

.gen-out{min-height:140px;font-size:.95rem}
.callout{border-left:3px solid var(--info);background:var(--info-soft);padding:10px 12px;border-radius:0 6px 6px 0;font-size:.9rem}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:24px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty strong{color:var(--fg);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;font-size:1.1rem}
[hidden]{display:none!important}
.banner{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.9rem;z-index:40;max-width:calc(100% - 32px)}
@media (min-width:861px){.toast{bottom:24px}}
.stars{font-family:var(--f-mono);letter-spacing:1px;color:var(--warn)}
.ficha{white-space:pre-wrap;font-family:var(--f-mono);font-size:.82rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:260px;overflow:auto}
.sep{height:1px;background:var(--line)}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px 14px;align-items:center}
.pgroup{display:flex;flex-direction:column;gap:10px}
.pgroup-h{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.pgroup-h h2{font-size:1.15rem;letter-spacing:.14em}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag-sub{font-family:var(--f-display);font-weight:700;font-size:.74rem;letter-spacing:.12em;background:var(--fg);color:var(--bg);padding:1px 7px 0;border-radius:3px;line-height:1.5}
.tag-inj{font-size:.76rem;font-weight:600;color:#ff5a4e;border:1px solid #ff5a4e;padding:0 7px;border-radius:3px;line-height:1.55}
.injury{width:20px;height:20px;flex:none;display:inline-grid;place-items:center;color:#e3261b;background:#ffffff;border-radius:3px}
.injury svg{width:16px;height:16px;display:block}
h1 .injury{width:30px;height:30px}h1 .injury svg{width:24px;height:24px}
.card.hurt{border-color:#5a1c18}
.card.coach{border-style:dashed;border-color:#5a5a57}

function link(u,label){const s=safeUrl(u);return s?`<a href="${esc(s)}" target="_blank" rel="noopener">${esc(label)}</a>`:""}
function age(fn){if(!validDate(fn))return null;const t=toD(todayStr()),b=toD(fn);let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return a}
function nextBday(fn){if(!validDate(fn))return null;const t=toD(todayStr());const b=toD(fn);let n=new Date(t.getFullYear(),b.getMonth(),b.getDate(),12);if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate(),12);const days=Math.round((n-t)/86400000);return{days,turns:n.getFullYear()-b.getFullYear(),date:n}}
function setPath(o,p,v){const k=p.split(".");let c=o;for(let i=0;i<k.length-1;i++){if(typeof c[k[i]]!=="object"||c[k[i]]===null)c[k[i]]={};c=c[k[i]]}c[k[k.length-1]]=v}
function getPath(o,p){return p.split(".").reduce((a,k)=>a==null?undefined:a[k],o)}
function phoneDigits(t){let d=String(t||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.length===9)d="34"+d;return d}
function waLink(tel,text){const d=phoneDigits(tel);return d?`https://wa.me/${d}${text?"?text="+encodeURIComponent(text):""}`:""}
function seasonOf(s){if(!validDate(s))return null;const d=toD(s);const y=d.getMonth()>=6?d.getFullYear():d.getFullYear()-1;return y}
function seasonLabel(y){return y+"/"+String((y+1)%100).padStart(2,"0")}
function parseDate(s){s=String(s||"").trim();if(validDate(s))return s;const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(!m)return "";let y=+m[3];if(y<100)y+=2000;return y+"-"+pad(m[2])+"-"+pad(m[1])}
function stars(n){n=Math.max(0,Math.min(5,Number(n)||0));return n?`<span class="stars" aria-label="${n} de 5">${"★".repeat(n)}${"☆".repeat(5-n)}</span>`:""}
function isMercadoAbierto(){const m=new Date().getMonth();return m===0||(m>=4&&m<=8)}
function catName(id){return(CATS.find(c=>c.id===id)||{}).nombre||id||"—"}

function perms(){if(S.me.isOwner)return PERM_ALL;const m=myMember();if(!m||m.activo===false)return null;return{...PERM_NONE,...(m.permisos||{}),admin:false}}
function memberName(id){return(S.miembros[id]&&S.miembros[id].nombre)||id||"—"}
function membersSorted(){return Object.values(S.miembros).sort((a,b)=>(a.orden??99)-(b.orden??99)||String(a.nombre).localeCompare(b.nombre))}
function isMine(j){const s=mySlug();return!!s&&Array.isArray(j.responsables)&&j.responsables.includes(s)}
function visibleJugadores(){const p=perms();if(!p||p.jugadores==="none")return[];const all=Object.values(S.jugadores);return p.jugadores==="suyos"?all.filter(isMine):all}
function canEditJug(j){const p=perms();if(!p)return false;if(p.jugadores==="todos")return true;if(p.jugadores==="suyos")return!j||isMine(j);return false}
function mercadoActual(){const c=S.config||DEFAULT_CONFIG;const id=c.mercadoActual||DEFAULT_CONFIG.mercadoActual;const m=(c.mercados||[]).find(x=>x.id===id);return{id,nombre:m?m.nombre:id}}
function posGrupo(j){const p=String(j.posicion||"").toUpperCase();for(const g of GRUPOS)if(g[2].includes(p))return g[0];const n=norm(p);if(n.startsWith("port"))return"por";if(n.startsWith("def")||n.includes("lateral")||n.includes("central"))return"def";if(n.includes("medio")||n.includes("centrocamp")||n.includes("pivote"))return"med";if(n.startsWith("del")||n.includes("extremo"))return"del";if(n.startsWith("entren"))return"ent";return"sin"}
function sub23Limit(){return seasonOf(todayStr())-22}
function isSub23(j){if(j.sub23===true)return true;if(j.sub23===false)return false;if(posGrupo(j)==="ent")return false;if(/\(\s*sub\s*23\s*\)/i.test(String(j.nombre||"")))return true;return validDate(j.fechaNac)&&Number(j.fechaNac.slice(0,4))>=sub23Limit()}
function isCoach(j){return posGrupo(j)==="ent"}

function teamName(j){return(j.equipo&&j.equipo.nombre)||j.club||"Su equipo"}
function matchTitle(j,x){const t=teamName(j);return x.local===false?`${x.rival||"?"} – ${t}`:`${t} – ${x.rival||"?"}`}
function resTag(u){if(!u||!u.resultado)return"";const d=u.desenlace;return`<span class="res ${esc(d||"E")}">${esc(d||"·")}</span>`}
function capSeg(c){return c.seguimientoActivo===true||(c.seguimientoActivo!==false&&["Contactado","Negociando"].includes(c.estado))}
function contactoDue(x,hoy){const lc=lastContact(x);const d=lc?daysBetween(lc.fecha,hoy):null;

function F(name,label,val,o={}){
  const id="f_"+FK+"_"+name.replace(/[^\w]/g,"_")+(o.vid?"_"+o.vid:"");
  const ro=o.ro?" disabled":"";
  if(o.type==="check")return`<label class="check${o.span?" span":""}"><input type="checkbox" id="${id}" name="${esc(name)}"${o.value!=null?` value="${esc(o.value)}"`:""}${val?" checked":""}${ro}><span>${esc(label)}</span></label>`;
  let inp;
  if(o.type==="select"){
    let opts=(o.opts||[]).map(x=>Array.isArray(x)?x:[x,x]);
    if(val!=null&&val!==""&&!opts.some(x=>String(x[0])===String(val)))opts=[[val,val],...opts];
    inp=`<select id="${id}" name="${esc(name)}"${ro}>${o.empty===false?"":`<option value="">${esc(o.emptyLabel||"—")}</option>`}${opts.map(([v,l])=>`<option value="${esc(v)}"${String(val??"")===String(v)?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
  }else if(o.type==="textarea"){
    inp=`<textarea id="${id}" name="${esc(name)}" rows="${o.rows||3}"${ro} placeholder="${esc(o.ph||"")}">${esc(val)}</textarea>`;
  }else{
    inp=`<input id="${id}" name="${esc(name)}" type="${o.type||"text"}" value="${esc(val)}"${o.step?` step="${o.step}"`:""}${o.min!=null?` min="${o.min}"`:""}${ro} placeholder="${esc(o.ph||"")}"${o.type==="number"?' inputmode="decimal"':""}${o.type==="tel"?' inputmode="tel"':""} autocomplete="off">`;
  }
  return`<div class="fld${o.span?" span":""}"><label for="${id}">${esc(label)}</label>${inp}</div>`;
}
function readForm(form){
  const out={};
  form.querySelectorAll("[name]").forEach(el=>{
    if(el.disabled)return;const n=el.getAttribute("name");
    if(n.endsWith("[]")){const k=n.slice(0,-2);const arr=getPath(out,k)||[];if(el.checked)arr.push(el.value);setPath(out,k,arr);return}
    let v;
    if(el.type==="checkbox")v=el.checked;
    else if(el.type==="number")v=el.value===""?null:Number(el.value);
    else v=el.value.trim();
    setPath(out,n,v);
  });
  return out;
}

function view(){
  if(S.noRuntime)return`<div class="empty"><strong>Abre la app desde Claude</strong><span>Los datos compartidos solo se cargan cuando abres esta página con tu cuenta de Claude.</span></div>`;
  if(!S.ready)return`<div class="loading">Cargando datos…</div>`;
  const p=perms();
  if(!p)return viewSinAcceso();
  const t=S.nav.tab;
  if(t==="jugadores"&&p.jugadores!=="none")return S.nav.id?viewJugador():viewJugadores();
  if(t==="dossier"&&p.jugadores!=="none")return viewDossier();
  if(t==="captacion"&&p.captacion)return viewCaptacion();
  if(t==="partidos"&&p.captacion)return viewPartidosSec();
  if(t==="tareas")return viewTareas();
  if(t==="mercado"&&p.mercado)return S.nav.id?viewEquipo():viewMercado();
  if(t==="equipo"&&p.admin)return viewAdmin();
  return viewInicio();
}

/* ----- Partidos del jugador (los rellena la actualización automática desde BeSoccer) ----- */
function partidosJ(j){return(Array.isArray(j.partidos)?j.partidos:[]).filter(p=>p&&validDate(p.fecha)).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha))}
function ultimoPartido(j){return partidosJ(j)[0]||null}
function estadoTxt(p){
  const m=p.minutos!=null&&p.minutos!==""?` · ${p.minutos}'`:"";
  switch(p.estado){
    case"titular":return`Titular${p.sale?` · sale en el ${p.sale}'`:""}${m}`;
    case"suplente":return`Entra en el ${p.entra??"?"}'${m}`;
    case"banquillo":return"Banquillo, no juega";
    case"no_convocado":return"No convocado";
    case"baja":return"Baja"+(p.lesion?` · ${p.lesion}`:"");
    case"sancionado":return"Sancionado";
    default:return"Sin datos de su participación";
  }
}
function rojaTxt(p){return p.roja!=null&&p.roja!==""?(p.dobleAmarilla?`Doble amarilla (${p.roja}')`:`Roja directa (${p.roja}')`):""}
function eventosHtml(p,compact){
  const out=[];
  const g=Number(p.goles)||0,a=Number(p.asistencias)||0;
  if(g)out.push(`<span class="ev ev-gol" title="Goles">GOL${g>1?" ×"+g:""}</span>`);
  if(a)out.push(`<span class="ev ev-as" title="Asistencias">ASIST${a>1?" ×"+a:""}</span>`);
  const am=Array.isArray(p.amarillas)?p.amarillas:[];
  am.forEach(mn=>out.push(`<span class="ev-card yc" title="Amarilla ${esc(mn)}'"></span>${compact?"":`<span class="ev-min">${esc(mn)}'</span>`}`));
  if(p.roja!=null&&p.roja!=="")out.push(`<span class="ev-card rc" title="${esc(rojaTxt(p))}"></span>${compact?"":`<span class="ev-min">${esc(p.roja)}'</span>`}`);
  if(p.lesion&&p.estado!=="baja")out.push(`<span class="ev ev-les" title="Lesión">LESIÓN</span>`);
  if(p.valoracion!=null&&p.valoracion!=="")out.push(`<span class="rating ${Number(p.valoracion)>=7?"hi":Number(p.valoracion)<5.5?"lo":""}" title="Valoración BeSoccer">${esc(Number(p.valoracion).toFixed(1))}</span>`);
  return out.join("");
}
function alertaPartido(p){
  if(!p)return null;
  if(p.roja!=null&&p.roja!=="")return{nivel:"bad",txt:"Expulsado: "+rojaTxt(p).toLowerCase()+". Probable sanción el próximo partido"};
  if(p.lesion)return{nivel:"bad",txt:"Lesión: "+p.lesion};
  if(p.estado==="no_convocado")return{nivel:"warn",txt:"No convocado"};
  if(p.estado==="banquillo")return{nivel:"warn",txt:"No jugó (banquillo)"};
  if((Number(p.goles)||0)>0)return{nivel:"ok",txt:(p.goles>1?p.goles+" goles":"Gol")};
  return null;
}

}

async function loadPdfJs(){
  if(window.pdfjsLib)return window.pdfjsLib;
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  return window.pdfjsLib;
}
async function docMaterial(docs,maxImgs){
  let text="";const imgs=[];
  for(const d of docs){
    const res=await fetch("/_blob/"+d.id);if(!res.ok)continue;const blob=await res.blob();
    if(/pdf/i.test(blob.type)||/\.pdf$/i.test(d.nombre||"")){
      const pdfjs=await loadPdfJs();const pdf=await pdfjs.getDocument({data:await blob.arrayBuffer()}).promise;
      let t="";for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();t+=tc.items.map(x=>x.str).join(" ")+"\n"}
      if(t.replace(/\s/g,"").length>300*pdf.numPages*0.5){text+=`\n--- ${d.nombre} ---\n`+t}
      else{for(let i=1;i<=pdf.numPages&&imgs.length<maxImgs;i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:1.6});const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;imgs.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85)))}}
    }else if(imgs.length<maxImgs)imgs.push(blob);
  }
  return{text:text.slice(0,120000),imgs};
}

async function guardarLectura(jid,auto){

  if(catOk)jUp.categoria=catOk;
  if(cl.club&&!j.club)jUp.club=cl.club;
  const priv={repr:{...((c&&c.repr)||{})},club:{...((c&&c.club)||{})}};
  if(ag.comisionPct!=null)priv.repr.pct=Number(ag.comisionPct);if(ag.formaPago)priv.repr.formaPago=ag.formaPago;

  Object.entries(map).forEach(([k,v])=>{if(v!=null&&v!=="")priv.club[k]=v});
  if(d.club&&!sps.length)priv.club.salarios="";
  if(cl.comision&&cl.comision.tipo)priv.club.comision={tipo:cl.comision.tipo,pct:cl.comision.pct??null,importe:cl.comision.importe??null,texto:cl.comision.texto??""};
  if(Object.keys(jUp).length)await safe(()=>col("jugadores").doc(jid).update(stamp(jUp)));

  if(ok){if(auto){L.guardado=true;L.busy=false}else delete S.lectura[jid]}
  render();

const TK_STOP=new Set(["cd","ud","sd","cf","fc","club","de","del","sad","ce","rcd","cp","ad","sc","ac","kirol","elkartea"]);

function relacionesCap(c){
  const rows=[];const seen=new Set();
  const add=(j,tipo,equipo,t,extra)=>{const k=j.id+"|"+tipo+"|"+teamKey(equipo||"")+"|"+(t||"");if(seen.has(k))return;seen.add(k);rows.push({j,tipo,equipo,t,...(extra||{})})};
  const mt=c.trayectoria||[],ms=c.selecciones||[],mc=c.cantera||[];const pc=puebloDe(c);const ac=anioDe(c);
  Object.values(S.jugadores).forEach(j=>{
    const jt=j.trayectoria||[],js=j.selecciones||[],jc=j.cantera||[];
    mt.forEach(a=>jt.forEach(b=>{if(teamKey(a.e)&&teamKey(a.e)===teamKey(b.e)){if(a.t&&a.t===b.t)add(j,"vestuario",a.e,a.t);else add(j,"club",a.e,"",{t1:a.t,t2:b.t})}}));

    mc.forEach(a=>jc.forEach(b=>{if(teamKey(a.e)&&teamKey(a.e)===teamKey(b.e)){const aj=anioDe(j);if(ac&&aj&&Math.abs(ac-aj)<=1)add(j,"cantera",a.e,"");else add(j,"club",a.e,"")}}));
    const pj=puebloDe(j);if(pc&&pj&&pc===pj)add(j,"pueblo",j.pueblo||j.lugarNacimiento,"");
  });

  const vestIds=new Set(vest.map(r=>r.j.id+"|"+teamKey(r.equipo)));
  return{vest,pueblo:rows.filter(r=>r.tipo==="pueblo"),club:rows.filter(r=>r.tipo==="club"&&!vestIds.has(r.j.id+"|"+teamKey(r.equipo)))};

/* ----- Tareas: apuntes personales, con dictado por voz y sincronización con Google Calendar ----- */
const DIAS_ES=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function misTareas(){const me=mySlug();return Object.values(S.tareas||{}).filter(t=>t.estado!=="borrada"&&(t.autor===me||(S.me.isOwner&&S.f.tTodas)))}
function tareaCuando(t){if(!validDate(t.fecha))return"Sin fecha";const d=toD(t.fecha);return d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"short"})+(t.hora?" · "+t.hora:"")}
function gcalLink(t){if(!validDate(t.fecha))return"";const f=t.fecha.replace(/-/g,"");let dates;
  if(t.hora&&/^\d{1,2}:\d{2}$/.test(t.hora)){const [h,m]=t.hora.split(":").map(Number);const ini=new Date(2000,0,1,h,m);const fin=new Date(ini.getTime()+(Number(t.duracion)||60)*60000);const hh=x=>pad(x.getHours())+pad(x.getMinutes())+"00";dates=f+"T"+hh(ini)+"/"+f+"T"+hh(fin)}
  else{const d2=new Date(toD(t.fecha).getTime()+864e5);dates=f+"/"+d2.getFullYear()+pad(d2.getMonth()+1)+pad(d2.getDate())}
  return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t.titulo||"Tarea")+"&dates="+dates+"&ctz=Europe/Madrid"+(t.lugar?"&location="+encodeURIComponent(t.lugar):"")+"&details="+encodeURIComponent([t.con?"Con: "+t.con:"",t.notas||"","Apuntada en la app ONLY FOOTBALL"].filter(Boolean).join("\n"))}
function gcalPill(t){const g=t.gcal||{};return g.estado==="creado"?`<span class="pill ok">En Google Calendar</span>`:g.estado==="error"?`<span class="pill bad" title="${esc(g.error||"")}">Error al pasar a Calendar</span>`:t.fecha?`<span class="pill">Pasa a Calendar en menos de 1 h</span>`:""}

async function tInterpretar(){
  const ta=document.getElementById("t_texto");const texto=(ta&&ta.value||"").trim();const d=S.dictado||(S.dictado={});d.texto=texto;
  if(!texto){toast("Di o escribe la tarea.");return}
  const hoy=todayStr();const dow=DIAS_ES[toD(hoy).getDay()];
  const fallback=()=>({titulo:texto.charAt(0).toUpperCase()+texto.slice(1),fecha:"",hora:"",lugar:"",con:"",notas:"",aviso:60});
  if(!S.sample){d.prop=fallback();render();return}
  d.busy=true;d.err="";render();
  const prompt=`Hoy es ${dow} ${hoy} (zona horaria Europe/Madrid). Convierte esta nota dictada por un agente de fútbol en una tarea. Devuelve SOLO un JSON con estas claves: "titulo" (corto y claro, en español, empezando por la acción: p. ej. "Reunión con Paco"), "fecha" (YYYY-MM-DD; "el próximo martes" = el primer martes después de hoy; si no se dice fecha, ""), "hora" (HH:MM en 24 h; "por la mañana" = "10:00", "por la tarde" = "17:00", "a mediodía" = "13:00"; si no se dice, ""), "lugar" (o ""), "con" (personas, o ""), "notas" (cualquier otro detalle útil, o ""). No inventes nada que no esté en la nota.\n\nNota: """${texto}"""`;
  try{const r=await S.sample(prompt,{cache:false});const m=String(r.text||"").match(/\{[\s\S]*\}/);const o=m?JSON.parse(m[0]):null;
    d.prop=o&&o.titulo?{titulo:o.titulo,fecha:validDate(o.fecha)?o.fecha:"",hora:/^\d{1,2}:\d{2}$/.test(o.hora||"")?o.hora.padStart(5,"0"):"",lugar:o.lugar||"",con:o.con||"",notas:o.notas||"",aviso:60}:fallback()}
  catch(e){console.error(e);d.err="No he podido interpretarla sola; revisa los datos y guárdala.";d.prop=fallback()}
  d.busy=false;render();
}
function tMic(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast("Usa el micrófono del teclado del móvil para dictar.");return}
  const d=S.dictado||(S.dictado={});
  if(d.escuchando&&S._rec){S._rec.stop();return}
  const rec=new R();S._rec=rec;rec.lang="es-ES";rec.interimResults=true;rec.continuous=false;
  const base=(document.getElementById("t_texto")||{}).value||"";
  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;const ta=document.getElementById("t_texto");if(ta)ta.value=(base?base+" ":"")+t;d.texto=ta?ta.value:t};
  rec.onerror=e=>{d.escuchando=false;render();if(e.error==="not-allowed"||e.error==="service-not-allowed")toast("No hay permiso para el micrófono aquí: usa el micrófono del teclado.");};
  rec.onend=()=>{d.escuchando=false;render();if((d.texto||"").trim())tInterpretar()};
  try{rec.start();d.escuchando=true;render()}catch(e){toast("No se pudo usar el micrófono: usa el del teclado.")}
}

function gcalInput(t){const ini=validDate(t.fecha)?t.fecha:todayStr();let o;
  if(t.hora&&/^\d{2}:\d{2}$/.test(t.hora)){const [h,m]=t.hora.split(":").map(Number);const end=new Date(2000,0,1,h,m+(Number(t.duracion)||60));o={startTime:ini+"T"+t.hora+":00",endTime:ini+"T"+pad(end.getHours())+":"+pad(end.getMinutes())+":00"}}
  else{const d2=new Date(toD(ini).getTime()+864e5);o={allDay:true,startTime:ini+"T00:00:00",endTime:d2.getFullYear()+"-"+pad(d2.getMonth()+1)+"-"+pad(d2.getDate())+"T00:00:00"}}
  const av=Number(t.aviso);const mins=av===0?null:(o.allDay?(av>=1440?1440:900):(av||60));
  return{...o,summary:t.titulo||"Tarea",location:t.lugar||"",description:[t.con?"Con: "+t.con:"",t.notas||"","Apuntada en la app ONLY FOOTBALL"].filter(Boolean).join("\n"),...(mins?{overrideReminders:[{method:"popup",minutes:mins}]}:{useDefaultReminders:false})}}
function gcalIdDe(p){if(!p)return"";if(typeof p==="string"){try{p=JSON.parse(p)}catch(_){const m=p.match(/"?id"?\s*[:=]\s*"?([A-Za-z0-9_]{8,})/);return m?m[1]:""}}return p.id||p.eventId||(p.event&&p.event.id)||""}
async function gcalCrear(id){const t=S.tareas[id];if(!t||!t.fecha)return;
  if(!S.mcp){await safe(()=>col("tareas").doc(id).update({gcal:{estado:"pendiente",motivo:"sin_conector"}}));return}
  try{const r=await S.mcp.callTool("Google Calendar","create_event",gcalInput(t));const eid=gcalIdDe(r.payload);
    await safe(()=>col("tareas").doc(id).update({gcal:{estado:"creado",eventId:eid,cuando:new Date().toISOString()}}),"Apuntada también en Google Calendar")}
  catch(e){console.warn(e);const c=e&&e.code;
    if(c==="server_unavailable"||c==="upstream_error"){await safe(()=>col("tareas").doc(id).update({gcal:{estado:"revisar",error:c}}));toast("No sé si llegó a Google Calendar: lo comprobaré en la próxima revisión.")}
    else{await safe(()=>col("tareas").doc(id).update({gcal:{estado:"pendiente",error:c||"error"}}));toast(c==="server_not_connected"||c==="needs_reauth"?"Google Calendar no está conectado: añádelo en Ajustes › Conectores de claude.ai. La tarea queda guardada.":c==="not_in_manifest"||c==="approval_required"?"No se dio permiso para usar Google Calendar: la pasaré en la próxima revisión automática.":"No se pudo pasar a Google Calendar ahora: lo intentaré en la próxima revisión automática.")}}
}
async function gcalBorrar(t){const eid=t&&t.gcal&&t.gcal.eventId;if(!eid||!S.mcp)return;try{await S.mcp.callTool("Google Calendar","delete_event",{eventId:eid})}catch(e){console.warn(e)}}

function zonaPos(x,y){
  const side=x<17?"I":x>51?"D":"C";
  if(y>=88&&side==="C")return"POR";
  if(y>=63)return side==="I"?"LI":side==="D"?"LD":"DFC";
  if(y>=45)return side==="I"?"MI":side==="D"?"MD":(y>=55?"MCD":"MC");
  if(y>=26)return side==="I"?"EI":side==="D"?"ED":"MCO";
  return side==="I"?"EI":side==="D"?"ED":"DC";
}

async function placeChip(pid,key,x,y){
  const p=S.partidos[pid];if(!p)return;const info=lineupInfo(p,key);if(!info)return;
  const arr=clone(p.marcadores||[]);
  const ex=arr.find(k=>k.lkey===key);
  if(ex){ex.x=+x.toFixed(1);ex.y=+y.toFixed(1);ex.posicion=zonaPos(x,y);await safe(()=>col("captacion_partidos").doc(pid).update({marcadores:arr}));return}
  const club=info.team==="visitante"?p.visitante:p.local;
  let cap=Object.values(S.capJug).find(c=>norm(c.nombre)===norm(info.n)&&(!c.club||norm(c.club)===norm(club)));
  let capId=cap&&cap.id;
  if(!capId){const ref=col("captacion_jugadores").doc();capId=ref.id;const eq=equipoPorNombre(club);
    const ok=await safe(()=>ref.set(stamp({nombre:info.n,posicion:zonaPos(x,y),club:club||"",categoria:(eq&&eq.cat)||catFromCompeticion(p.categoria)||p.categoria||"",estado:"Observado",captador:p.captador||mySlug(),valoracion:"",origenPartido:pid,tieneAgente:"",firmadoAgente:"",situacion:""})));if(!ok)return}
  arr.push({id:uid(),lkey:key,x:+x.toFixed(1),y:+y.toFixed(1),equipo:info.team,dorsal:info.d??"",nombre:info.n||"",posicion:zonaPos(x,y),posBesoccer:info.p||"",nota:"",valoracion:"",capId});

async function safe(fn,ok){try{await fn();if(ok)toast(ok);return true}catch(e){console.error(e);const code=e&&e.code;toast(code==="invalid_argument"?"No tienes permiso para guardar esto.":code==="quota_exceeded"?"Se ha llenado el espacio de la app.":"No se pudo guardar. Revisa la conexión y vuelve a intentarlo.");return false}}

function parseTable(txt){
  const lines=txt.replace(/\r/g,"").split("\n").filter(l=>l.trim());if(!lines.length)return[];
  const d=lines[0].includes("\t")?"\t":(lines[0].split(";").length>lines[0].split(",").length?";":",");
  const parseLine=l=>{if(d==="\t")return l.split("\t");const out=[];let cur="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'&&l[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===d){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out};
  return lines.map(parseLine);
}
function mapHeaders(head,cols){const map={};head.forEach((h,i)=>{const n=norm(h).replace(/[.:]/g,"");for(const [k,al] of Object.entries(cols)){if(map[k]!=null)continue;if(al.some(a=>n===a||n.startsWith(a+" ")||n.startsWith(a))){map[k]=i;break}}});return map}
function guessPos(t){const n=norm(t);if(!n)return"";const up=t.trim().toUpperCase();if(POS[up])return up;
  const r=[["port","POR"],["lateral der","LD"],["lateral izq","LI"],["carrilero der","MD"],["carrilero izq","MI"],["interior der","MD"],["interior izq","MI"],["central","DFC"],["pivote","MCD"],["medio centro","MC"],["mediocentro","MC"],["mediapunta","MCO"],["media punta","MCO"],["extremo der","ED"],["extremo izq","EI"],["extremo","ED"],["delantero","DC"],["punta","DC"],["lateral","LD"]];
  for(const [k,v] of r)if(n.includes(k))return v;return t.trim()}
function sino(t){const n=norm(t);if(!n)return"";if(n.startsWith("si")||n==="x"||n==="yes")return"Sí";if(n.startsWith("no s"))return"No sé";if(n.startsWith("no"))return"No";return"No sé"}
function findMember(t){const n=norm(t);if(!n)return"";const m=membersSorted().find(m=>norm(m.nombre).startsWith(n.split(" ")[0])||n.includes(norm(m.nombre).split(" ")[0]));return m?m.id:""}

        const ex=byName.get(norm(name));if(ex){await col("jugadores").doc(ex.id).update(stamp(o));actualizados++}else{const ref=col("jugadores").doc();await ref.set(stamp({nombre:name,...o,responsables:["josemi"],seguimientos:[]}));byName.set(norm(name),{id:ref.id});creados++}}
      else if(t==="captacion"){const o={nombre:name};["club","situacion"].forEach(k=>{const v=got(k)(r);if(v)o[k]=v});const pz=got("posicion")(r);if(pz)o.posicion=guessPos(pz);const ag=got("tieneAgente")(r);if(ag){const s=sino(ag);o.tieneAgente=s==="No sé"&&ag.length>3?"Sí":s;if(o.tieneAgente==="Sí"&&norm(ag)!=="si")o.agente=ag}const fi=got("firmadoAgente")(r);if(fi)o.firmadoAgente=sino(fi);const cp=findMember(got("captadorTxt")(r));if(cp)o.captador=cp;
        const ex=byName.get(norm(name));if(ex){await col("captacion_jugadores").doc(ex.id).update(stamp(o));actualizados++}else{const ref=col("captacion_jugadores").doc();await ref.set(stamp({estado:"En seguimiento",...o}));byName.set(norm(name),{id:ref.id});creados++}}
      else if(t==="mercado"){const contacto={nombre:got("dd")(r),cargo:got("cargo")(r),telefono:got("telefono")(r)};const fecha=parseDate(got("fecha")(r));const nec=got("necesidades")(r);const grupo=got("grupo")(r).replace(/\D/g,"")||grpSel||"";
        const ex=eqByName.get(norm(name));
        if(ex){const cs=clone(ex.contactos||[]);if(contacto.nombre&&!cs.some(c=>norm(c.nombre)===norm(contacto.nombre)))cs.unshift(contacto);const up={contactos:cs};if(grupo)up.grupo=grupo;if(fecha||nec){const prev=clone((ex.mercados||{})[cur.id]||{});up.mercados={[cur.id]:{...prev,fecha:fecha||prev.fecha||"",necesidades:nec||prev.necesidades||""}}}await col("mercado_equipos").doc(ex.id).update(stamp(up));actualizados++}
        else{const ref=col("mercado_equipos").doc();const o={nombre:name,categoria:catSel,grupo,ciudad:"",responsable:catSel==="3rfef"?"":"josemi",contactos:contacto.nombre||contacto.telefono?[contacto]:[],mercados:(fecha||nec)?{[cur.id]:{fecha:fecha||"",necesidades:nec,posiciones:[],ofrecidos:[]}}:{}};await ref.set(stamp(o));eqByName.set(norm(name),{id:ref.id,...o});creados++}}
    }catch(e){console.error(e);saltados++}
  }
  S.importLog=`Importación terminada: ${creados} nuevos, ${actualizados} actualizados${saltados?`, ${saltados} filas sin datos o con error`:""}.`;
  const ta=document.getElementById("imp_txt");if(ta)ta.value="";render();
}

document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;

    case"openEq":go("mercado",el.dataset.id);break;
    case"mPick":clean();S.f.meq=el.dataset.v;S.f.meqOtro=false;render();window.scrollTo(0,0);break;
    case"mOtroCancel":S.f.meqOtro=false;render();break;
    case"tMic":tMic();break;
    case"tInterpretar":tInterpretar();break;
    case"tDescartar":clean();S.dictado={};render();break;
    case"tDone":{const t=S.tareas[el.dataset.id];if(t){const h=t.estado!=="hecha";await safe(()=>col("tareas").doc(t.id).update({estado:h?"hecha":"pendiente",hechaEl:h?new Date().toISOString():""}),h?"Hecha":"Vuelve a pendientes")}break}
    case"cambioEq":S.f.cambioEq=el.dataset.id;render();break;
    case"cambioEqCancel":clean();S.f.cambioEq="";render();break;

    case"mContCancel":clean();S.f.mcont=false;render();break;
    case"ctab":S.f.ctab=el.dataset.t;S.newForm=null;render();break;
    case"ctabBack":S.f.ctab=el.dataset.t;go("captacion");break;
    case"newForm":clean();S.newForm=S.newForm===el.dataset.form?null:el.dataset.form;render();break;
    case"cancelNew":clean();S.newForm=null;render();break;
    case"cest":S.f.cest=el.dataset.v;render();break;
    case"mcat":S.f.mcat=el.dataset.v;S.f.mgrupo="";S.newForm=null;render();break;
    case"arm":e.preventDefault();clean();arm(el.dataset.key);break;
    case"lchip":{if(Date.now()-S.suppressClick<450)break;const k=el.dataset.lchip;S.pickChip=S.pickChip===k?null:k;S.pitchDraft=null;S.pitchSel=null;render();break}
    case"acredEml":acredEml(el.dataset.id);break;
    case"acredVer":S.f.acredOpen=S.f.acredOpen===el.dataset.id?"":el.dataset.id;render();break;
    case"acredCopy":{const p=S.partidos[el.dataset.id];if(p){const m=acredMail(p);copyText(el.dataset.what==="asunto"?m.asunto:m.cuerpo)}break}
    case"lteam":S.f.lteam=el.dataset.v;S.pickChip=null;render();break;
    case"pickCancel":S.pickChip=null;render();break;
    case"pitch":{if(Date.now()-S.suppressClick<450)break;if(S.pickChip){const q=svgPoint(e.clientX,e.clientY);if(q){const k=S.pickChip;S.pickChip=null;await placeChip(S.nav.id,k,q.x,q.y);render()}break}const svg=el;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const ctm=svg.getScreenCTM();if(!ctm)return;const p=pt.matrixTransform(ctm.inverse());const x=Math.max(1,Math.min(67,p.x)),y=Math.max(1,Math.min(104,p.y));clean();S.pitchSel=null;S.pitchDraft={x,y,pos:zonaPos(x,y)};render();break}
    case"marker":if(Date.now()-S.suppressClick<450)break;e.stopPropagation();clean();S.pitchDraft=null;S.pitchSel=el.dataset.mid;render();break;

    case"genStop":ctrls[el.dataset.key]?.abort();break;
    case"genCopy":{const t=document.getElementById("gout_"+el.dataset.key);copyText(t?t.value:"");break}
    case"genWa":{const key=el.dataset.key;const j=S.jugadores[key.split(":")[0]];const t=document.getElementById("gout_"+key);const u=waLink(j&&j.telefono,t?t.value:"");if(u){const aEl=document.createElement("a");aEl.href=u;aEl.target="_blank";aEl.rel="noopener";document.body.appendChild(aEl);aEl.click();aEl.remove()}break}
    case"genLog":{const key=el.dataset.key;const jid=key.split(":")[0];const j=S.jugadores[jid];const t=document.getElementById("gout_"+key);const txt=t?t.value.trim():"";if(!txt)return toast("Primero genera o escribe el mensaje.");const seg=clone(j.seguimientos||[]);seg.unshift({id:uid(),fecha:todayStr(),canal:(S.gen[key]||{}).canal==="WhatsApp"?"WhatsApp":"Teléfono",nota:"Mensaje enviado: "+txt.slice(0,600),autor:mySlug()});await safe(()=>col("jugadores").doc(jid).update({seguimientos:seg.slice(0,300)}),"Registrado en el seguimiento");render();break}
    case"capInforme":capInforme(el.dataset.id);break;
    case"capInfSave":{const id=el.dataset.id;const t=document.getElementById("gout_cap:"+id);const v=t?t.value.trim():"";if(!v)return toast("No hay informe que guardar.");const c=S.capJug[id];await safe(()=>col("captacion_jugadores").doc(id).update(stamp({situacion:(c.situacion?c.situacion+"\n\n":"")+v})),"Añadido a la situación");render();break}
    case"ofrecer":ofrecer(el.dataset.id);break;

    case"addContacto":{const e2=S.equipos[S.nav.id];const cs=clone(e2.contactos||[]);if(!cs.length)cs.push({});cs.push({});clean();await safe(()=>col("mercado_equipos").doc(e2.id).update({contactos:cs}));render();break}
    case"solOk":{const id=el.dataset.id;const s=document.getElementById("solm_"+id);if(!s||!s.value)return toast("Elige quién es esta persona.");const m=S.miembros[s.value];if(await safe(()=>S.db.doc("miembros/"+m.id).update({userId:id,activo:true}))){await safe(()=>S.db.doc("solicitudes/"+id).delete(),"Acceso dado a "+m.nombre)}render();break}
    case"unlink":{const id=el.dataset.id;await safe(()=>S.db.doc("miembros/"+id).update({userId:""}),"Cuenta desvinculada");render();break}

    case"lectLeer":leerContratos(el.dataset.id);break;
    case"lectGuardar":guardarLectura(el.dataset.id);break;
    case"lectDescartar":delete S.lectura[el.dataset.id];render();break;
    case"liqSave":{const jid=el.dataset.id;const c=S.contratos[jid];const L=liquidar(S.jugadores[jid],c);const reg=clone((c&&c.comisiones)||[]);
      L.rows.forEach(r=>{if(r.club>0)reg.push({temporada:r.temporada,concepto:"Comisión de representación",paga:"Club",importe:r2(r.club),iva:r2(r.ivaClub),total:r2(r.club+r.ivaClub),estado:"Pendiente"});if(r.jug>0)reg.push({temporada:r.temporada,concepto:"Comisión de representación",paga:"Jugador",importe:r2(r.jug),iva:r2(r.ivaJug),total:r2(r.jug+r.ivaJug),estado:"Pendiente"})});
      const ref=S.db.doc("privado/contratos/items/"+jid);await safe(()=>c?ref.update({comisiones:reg}):ref.set({comisiones:reg,club:{}}),"Añadido al registro");render();break}
    case"jgrp":S.f.jgrp=el.dataset.v;render();break;
    case"jsub":S.f.jsub=!S.f.jsub;render();break;
    case"selStart":S.selMode=true;S.sel=S.dos?S.dos.ids.slice():[];if(S.nav.tab!=="jugadores"||S.nav.id){const keep=S.sel;go("jugadores");S.selMode=true;S.sel=keep;render()}else render();break;
    case"selCancel":S.selMode=false;S.sel=[];render();break;
    case"selJug":{const id=el.dataset.id;S.sel=S.sel.includes(id)?S.sel.filter(x=>x!==id):[...S.sel,id];render();break}
    case"selGo":startDossier(S.sel,S.dos?{titulo:S.dos.titulo,para:S.dos.para,equipoId:S.dos.equipoId,nota:S.dos.nota,contacto:S.dos.contacto}:{});break;

    case"dosMove":{const i=+el.dataset.i,dir=+el.dataset.dir,ids=S.dos.ids,k=i+dir;if(k<0||k>=ids.length)break;[ids[i],ids[k]]=[ids[k],ids[i]];render();break}
    case"dosDel":S.dos.ids.splice(+el.dataset.i,1);render();break;

document.addEventListener("click",e=>{const a=e.target.closest("[data-acredsent]");if(a)setTimeout(()=>marcarSolicitada(a.dataset.acredsent),400)});

document.addEventListener("change",async e=>{
  const t=e.target;

  if(t.dataset.dos==="equipoId"&&S.dos){S.dos.equipoId=t.value;const e2=S.equipos[t.value];if(e2)S.dos.para=e2.nombre;render();return}

    if(t.dataset.mknote)k.nota=t.value;else k.valoracion=t.value;clean();

    if(t.dataset.mkval&&k.capId&&S.capJug[k.capId]&&t.value)await safe(()=>col("captacion_jugadores").doc(k.capId).update({valoracion:t.value}));
    if(t.dataset.mknote&&k.capId&&S.capJug[k.capId]&&!S.capJug[k.capId].situacion&&t.value)await safe(()=>col("captacion_jugadores").doc(k.capId).update({situacion:t.value}));

    try{localStorage.setItem("of_merc",JSON.stringify({c:S.f.mcat,g:S.f.mgrupo,e:S.f.meq}))}catch(_){}render();return}
  if(a==="npGrupo"){S.f.npGrupo=t.value;const cap=document.getElementById("f_np_captador");const v=cap&&cap.value;render();const c2=document.getElementById("f_np_captador");if(c2&&v)c2.value=v;return}
  if(a==="mmine"){S.f.mmine=t.checked;render()}
  else if(a==="impT"){S.f.imp=t.value;S.importLog="";render()}
  else if(a==="ofEstado"){const e2=S.equipos[S.nav.id];const cur=mercadoActual();const mm=clone((e2.mercados||{})[cur.id]||{});const i=+t.dataset.i;if(mm.ofrecidos&&mm.ofrecidos[i]){mm.ofrecidos[i].estado=t.value;await safe(()=>col("mercado_equipos").doc(e2.id).update(stamp({mercados:{...clone(e2.mercados||{}),[cur.id]:mm}})),"Estado actualizado")}}
  else if(a==="comToggle"){const jid=t.dataset.id;const c=S.contratos[jid];const ref=S.db.doc("privado/contratos/items/"+jid);const v=t.checked;clean();await safe(()=>c?ref.update(stamp({repr:{cobrarComision:v}})):ref.set(stamp({repr:{cobrarComision:v},club:{},comisiones:[]})),v?"Comisión activada":"Comisión desactivada");render()}
  else if(a==="comEstado"){const jid=t.dataset.id;const c=S.contratos[jid];const reg=clone(c.comisiones||[]);const i=+t.dataset.i;if(reg[i]){reg[i].estado=t.value;await safe(()=>S.db.doc("privado/contratos/items/"+jid).update({comisiones:reg}),"Comisión "+t.value.toLowerCase())}}
});

/* ===================== Arranque ===================== */
function subColl(path,key){
  S.db.collection(path).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]={...d.data(),id:d.id}});S[key]=o;S.loaded[key]=true;checkReady();scheduleRender()},err=>{console.warn(path,err);S.loaded[key]=true;checkReady();scheduleRender()});
}
function checkReady(){if(!S.ready&&S.loaded.miembros&&S.loaded.config){S.ready=true;autoLinkOwner()}}
let linking=false;
async function autoLinkOwner(){
  if(!S.me.isOwner||!S.me.id||linking)return;
  if(Object.values(S.miembros).some(m=>m.userId===S.me.id))return;
  const j=S.miembros.josemi;if(!j||j.userId)return;
  linking=true;try{await S.db.doc("miembros/josemi").update({userId:S.me.id,activo:true})}catch(e){console.warn(e)}linking=false;
}
async function boot(){
  if(!window.claude||typeof window.claude.use!=="function"){S.noRuntime=true;render();return}
  render();
  const [db,user,sample,assets,downloads]=await Promise.all(["db","user","sample","assets","downloads"].map(n=>window.claude.use(n).catch(()=>null)));
  S.db=db;S.user=user;S.sample=sample;S.assets=assets;S.downloads=downloads;window.claude.use("mcp").then(m=>{S.mcp=m}).catch(()=>{});
  if(!db){S.noRuntime=true;render();return}
  if(user){const me=await user.me();S.me.id=me.id;S.me.isOwner=!!me.isOwner;S.me.canEdit=!!me.canEdit}
  subColl("miembros","miembros");
  S.db.doc("config/app").onSnapshot(d=>{S.config=d.exists?{...d.data()}:null;S.loaded.config=true;checkReady();scheduleRender()},()=>{S.loaded.config=true;checkReady();scheduleRender()});
  subColl("jugadores","jugadores");
  subColl("captacion_partidos","partidos");
  subColl("captacion_jugadores","capJug");
  subColl("calendario","calendario");
  subColl("tareas","tareas");
  subColl("acred_clubs","acredClubs");
  S.db.doc("config/acreditaciones").onSnapshot(d=>{S.acredCfg=d.exists?{...d.data()}:null;scheduleRender()},()=>{});
  subColl("mercado_equipos","equipos");
  subColl("privado/contratos/items","contratos");
  subColl("dossieres","dossieres");
  S.db.doc("config/sync").onSnapshot(d=>{S.sync=d.exists?{...d.data()}:null;scheduleRender()},()=>{});
  if(S.me.isOwner)subColl("solicitudes","solicitudes");
  else if(S.me.id)S.db.doc("solicitudes/"+S.me.id).onSnapshot(d=>{S.miSolicitud=d.exists?d.data():null;scheduleRender()},()=>{});
  setTimeout(()=>{if(!S.ready){S.ready=true;scheduleRender()}},8000);
}
try{S.f.inicioOpen=JSON.parse(localStorage.getItem("of_inicio")||"[]")}catch(_){}
try{const m=JSON.parse(localStorage.getItem("of_merc")||"null");if(m){S.f.mcat=m.c||"";S.f.mgrupo=m.g||"";S.f.meq=m.e||""}}catch(_){}
boot();
